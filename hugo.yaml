baseURL: "https://alifnaufal.me/"
title: "~/n6ufal"
theme: "PaperMod"
enableGitInfo: true
defaultContentLanguage: "en"
timeZone: "Asia/Jakarta"

params:
    env: production
    hideFooter: true
    # Last.fm
    lastfmApiKey: "0e7245c9a19b6563e2a301c91f053c54"
    lastfmUser: "alifnaufal"
    # Theme
    defaultTheme: dark
    disableThemeToggle: true
    # Meta
    Description: "Alif Naufal's personal blog or whatever."
    # Features
    ShowReadingTime: true
    ShowShareButtons: false
    ShowPostNavLinks: true
    ShowCodeCopyButtons: true
    ShowBreadCrumbs: true
    ShowToc: true
    TocOpen: false
    ShowBackToTop: true
    externalLinkNewTab: true
    # Images
    images: ["/images/avatar.jpg"]
    assets:
        favicon: "/favicon.ico"
        favicon96x96: "/favicon-96x96.png"
        apple_touch_icon: "/apple-touch-icon.png"
        safari_pinned_tab: "/favicon.svg"
        theme_color: "#2E3440"
        msapplication_TileColor: "#2E3440"
    canonicalURL: "https://alifnaufal.me"
    # Profile Mode
    profileMode:
        enabled: true
        title: "Alif Naufal"
        imageUrl: "/images/avatar.jpg"
        imageWidth: 120
        imageHeight: 120
    socialIcons:
        - name: email
          url: "mailto:alifnaufal@duck.com"
        - name: github
          url: "https://github.com/n6ufal"
        - name: discord
          url: "https://discordapp.com/users/460866504704131084"
        - name: instagram
          url: "https://instagram.com/n6ufal"
        - name: lastfm
          url: "https://www.last.fm/user/alifnaufal"
        - name: spotify
          url: "https://open.spotify.com/user/fjvvc8gihy2bj471qal9zrg6v"
        - name: rss
          url: "/index.xml"
          title: "RSS"

menu:
    main:
        - name: Posts
          url: /posts/
          weight: 1
        - name: Moodboard
          url: /moodboard/
          weight: 2
        - name: About
          url: /about/
          weight: 3

pagination:
    pagerSize: 5

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        style: nord
        lineNos: true
        lineNumbersInTable: false
        noClasses: false
        guessSyntax: true

security:
  funcs:
    getenv: ['^HUGO_', '^CI$', '^GITHUB_SHA$']

imaging:
    quality: 80
    resampleFilter: Lanczos

outputs:
    home:
        - HTML
        - RSS
