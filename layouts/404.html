{{- define "main" }}
<div class="not-found">
    <div class="dialogue">
        <p><span class="speaker">Woman:</span> If tomatoes are fruits, why aren't they in fruit salad?</p>
        <p><span class="speaker">Man:</span> Because nobody wants them there.</p>
        <p><span class="speaker">Woman:</span> Sounds political.</p>
        <p><span class="speaker">Man:</span> <a href="{{ "" | absLangURL }}" class="home-link">Wanna go home?</a></p>
    </div>
</div>

<style>
html, body {
    margin: 0;
    min-height: 100vh;
}
.not-found {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
}
.dialogue {
    max-width: 32rem;
    width: 100%;
    font-family: 'IBM Plex Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 17px;
    line-height: 1.6;
    color: #d8dee9;
}
.speaker {
    color: #81a1c1;
}
.home-link {
    color: #e8a9d0;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
    transition: opacity 0.2s;
}
.home-link:hover {
    opacity: 0.7;
}
</style>
{{- end }}
