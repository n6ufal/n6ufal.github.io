<div id="lastfm-tracks" class="lastfm-widget">
  <p class="lastfm-loading">Loading recent tracks...</p>
</div>

<script>
// Last.fm widget - calls serverless function for API data
(function() {
  // Use serverless function endpoint (works both locally and deployed)
  const apiEndpoint = "/.netlify/functions/lastfm";

  const container = document.getElementById("lastfm-tracks");
  if (!container) return;

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatTrack(track) {
    const isNowPlaying = track["@attr"]?.nowplaying === "true";
    const name = track.name;
    const artist = track.artist["#text"];
    const trackUrl = track.url;

    return `
      <li class="lastfm-item">
        <span class="lastfm-icon ${isNowPlaying ? 'playing' : 'paused'}">${isNowPlaying ? '▶' : '♪'}</span>
        <a href="${escapeHtml(trackUrl)}" target="_blank" rel="noopener noreferrer" class="lastfm-track">
          ${escapeHtml(name)} <span class="lastfm-artist">— ${escapeHtml(artist)}</span>
        </a>
      </li>
    `;
  }

  function loadTracks() {
    fetch(apiEndpoint)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        if (!data.recenttracks || !data.recenttracks.track) throw new Error("Invalid response");
        
        const tracks = Array.isArray(data.recenttracks.track)
          ? data.recenttracks.track.slice(0, 5)
          : [data.recenttracks.track];
        
        let html = `<p class="lastfm-header">Recently played</p><ul class="lastfm-list">`;
        tracks.forEach(track => { html += formatTrack(track); });
        html += `</ul>`;
        container.innerHTML = html;
      })
      .catch(err => {
        console.warn("Last.fm error:", err);
        container.innerHTML = `<p class="lastfm-error">Couldn't load tracks.</p>`;
      });
  }

  loadTracks();

  let interval;
  function startInterval() {
    if (interval) clearInterval(interval);
    interval = setInterval(() => {
      if (document.visibilityState === "visible") loadTracks();
    }, 30000);
  }
  startInterval();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") loadTracks();
  });
})();
</script>
