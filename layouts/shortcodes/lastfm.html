<div id="lastfm-tracks" class="lastfm-widget">
  <p class="lastfm-loading">Loading recent tracks...</p>
</div>

<script>
  const apiKey = "0e7245c9a19b6563e2a301c91f053c54";
  const user = "alifnaufal";
  const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${user}&api_key=${apiKey}&format=json&limit=5`;

  function fetchTracks() {
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const tracks = data.recenttracks.track.slice(0, 5);
        const container = document.getElementById("lastfm-tracks");

        let html = `<p style="font-family: 'Geist', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary); margin-bottom: 0.75rem;">Recently played</p><ul style="list-style: none; padding: 0; margin: 0;">`;

        tracks.forEach(track => {
          const isNowPlaying = track["@attr"]?.nowplaying === "true";
          const name = track.name;
          const artist = track.artist["#text"];
          const trackUrl = track.url;

          html += `
  <li style="margin-bottom: 0.4rem; font-size: 0.875rem; font-family: 'Inter', sans-serif; font-weight: 400;">
    ${isNowPlaying ? `<span style="color: #A3BE8C; margin-right: 0.4rem;">▶</span>` : `<span style="color: var(--secondary); margin-right: 0.4rem;">♪</span>`}
    <a href="${trackUrl}" target="_blank" rel="noopener" style="color: var(--primary); text-decoration: none; font-weight: 400;">
      ${name} <span style="color: var(--secondary);">— ${artist}</span>
    </a>
  </li>`;
        });

        html += `</ul>`;
        container.innerHTML = html;
      })
      .catch(err => {
        console.warn("Last.fm error:", err);
        container.innerHTML = `<p class="lastfm-error">Couldn't load tracks.</p>`;
      });
  }

  fetchTracks();

  let interval;
  function startInterval() {
    if (interval) clearInterval(interval);
    interval = setInterval(() => {
      if (document.visibilityState === "visible") fetchTracks();
    }, 30000);
  }
  startInterval();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") fetchTracks();
  });
</script>
