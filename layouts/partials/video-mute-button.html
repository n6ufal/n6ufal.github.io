{{- if .IsHome }}
<button
    id="video-mute-btn"
    class="video-mute-btn"
    aria-label="Toggle video mute"
    title="Toggle video audio (M)"
>
    <svg
        class="mute-icon-speaker"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path
            d="M15.54 8.46a7 7 0 0 1 0 9.9M19.07 4.93a10 10 0 0 1 0 14.14"
        ></path>
    </svg>
    <svg
        class="mute-icon-muted"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
</button>

<script>
    (function () {
        const btn = document.getElementById("video-mute-btn");
        const video = document.getElementById("homeVideoPlayer");
        if (!btn || !video) return;

        function updateButtonState() {
            btn.classList.toggle("is-muted", video.muted);
        }

        btn.addEventListener("click", function (e) {
            e.preventDefault();
            video.muted = !video.muted;
            updateButtonState();
        });

        video.addEventListener("volumechange", updateButtonState);

        document.addEventListener("keydown", function (e) {
            if (
                (e.key === "m" || e.key === "M") &&
                document.activeElement.tagName !== "INPUT" &&
                document.activeElement.tagName !== "TEXTAREA"
            ) {
                video.muted = !video.muted;
                updateButtonState();
            }
        });

        updateButtonState();
    })();
</script>
{{- end }}
