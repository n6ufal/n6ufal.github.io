<div class="lastfm-widget">
    <div id="lastfm-tracks" class="lastfm-content">
        <p class="lastfm-loading">Loading...</p>
    </div>
</div>

<script>
    (function () {
        const API_KEY = "0e7245c9a19b6563e2a301c91f053c54";
        const USER = "alifnaufal";
        const container = document.getElementById("lastfm-tracks");

        function getBestImage(imageArray) {
            if (!Array.isArray(imageArray)) return "";
            for (const size of ["extralarge", "large", "medium", "small"]) {
                const img = imageArray.find((img) => img.size === size);
                if (img && img["#text"]) return img["#text"];
            }
            return "";
        }

        function fetchData() {
            fetch(
                `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USER}&api_key=${API_KEY}&format=json&limit=5`,
            )
                .then((res) => res.json())
                .then((data) => {
                    const tracks = data.recenttracks.track.slice(0, 5);
                    let html = `<p class="lastfm-header">Recently played</p><ul class="lastfm-list">`;
                    for (const track of tracks) {
                        const isNowPlaying =
                            track["@attr"]?.nowplaying === "true";
                        const art = getBestImage(track.image);
                        html += `
                            <li class="lastfm-item">
                                ${art ? `<img class="lastfm-art" src="${art}" alt="${track.name}" loading="lazy" />` : `<span class="lastfm-art lastfm-art--placeholder"></span>`}
                                <span class="${isNowPlaying ? "lastfm-icon playing" : "lastfm-icon paused"}">${isNowPlaying ? "▶" : "♪"}</span>
                                <a href="${track.url}" target="_blank" rel="noopener" class="lastfm-track">
                                    ${track.name} <span class="lastfm-artist">— ${track.artist["#text"]}</span>
                                </a>
                            </li>`;
                    }
                    container.innerHTML = html + `</ul>`;
                })
                .catch(() => {
                    container.innerHTML = `<p class="lastfm-error">Couldn't load data.</p>`;
                });
        }

        fetchData();

        setInterval(() => {
            if (document.visibilityState === "visible") fetchData();
        }, 60000);

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") fetchData();
        });
    })();
</script>
