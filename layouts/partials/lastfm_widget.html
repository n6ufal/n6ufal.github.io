<div class="lastfm-widget">
    <div class="lastfm-controls">
        <span
            class="lastfm-dot"
            data-view="recent"
            title="Recently Played"
        ></span>
        <span
            class="lastfm-dot"
            data-view="topAlbums"
            title="Top Albums"
        ></span>
        <span
            class="lastfm-dot"
            data-view="topArtists"
            title="Top Artists"
        ></span>
    </div>
    <div id="lastfm-tracks" class="lastfm-content">
        <p class="lastfm-loading">Loading...</p>
    </div>
</div>

<style>
    .lastfm-controls {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        justify-content: center;
    }

    .lastfm-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        cursor: pointer;
        transition: all 0.2s ease;
        opacity: 0.4;
    }

    .lastfm-dot:hover {
        opacity: 0.6;
    }

    .lastfm-dot.active {
        opacity: 1;
        background-color: currentColor;
    }
</style>

<script>
    const apiKey = "0e7245c9a19b6563e2a301c91f053c54";
    const user = "alifnaufal";
    const container = document.getElementById("lastfm-tracks");
    const dots = document.querySelectorAll(".lastfm-dot");
    let currentView = localStorage.getItem("lastfm-view") || "recent";
    let autoRefreshInterval;

    // API URLs
    const endpoints = {
        recent: () =>
            `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${user}&api_key=${apiKey}&format=json&limit=5`,
        topAlbums: () =>
            `https://ws.audioscrobbler.com/2.0/?method=user.gettopalbums&user=${user}&api_key=${apiKey}&format=json&limit=5&period=overall`,
        topArtists: () =>
            `https://ws.audioscrobbler.com/2.0/?method=user.gettopartists&user=${user}&api_key=${apiKey}&format=json&limit=5&period=overall`,
    };

    // Fetch data based on current view
    function fetchData() {
        const url = endpoints[currentView]();
        fetch(url)
            .then((res) => res.json())
            .then((data) => {
                if (currentView === "recent") {
                    renderRecentTracks(data);
                } else if (currentView === "topAlbums") {
                    renderTopAlbums(data);
                } else if (currentView === "topArtists") {
                    renderTopArtists(data);
                }
            })
            .catch((err) => {
                console.warn("Last.fm error:", err);
                container.innerHTML = `<p class="lastfm-error">Couldn't load data.</p>`;
            });
    }

    // Render recently played tracks
    function renderRecentTracks(data) {
        const tracks = data.recenttracks.track.slice(0, 5);
        let html = `<p class="lastfm-header">Recently played</p><ul class="lastfm-list">`;

        tracks.forEach((track) => {
            const isNowPlaying = track["@attr"]?.nowplaying === "true";
            const name = track.name;
            const artist = track.artist["#text"];
            const trackUrl = track.url;
            const iconClass = isNowPlaying
                ? "lastfm-icon playing"
                : "lastfm-icon paused";
            const icon = isNowPlaying ? "▶" : "♪";
            const art =
                track.image?.find((img) => img.size === "small")?.["#text"] ||
                "";

            html += `
  <li class="lastfm-item">
    ${art ? `<img class="lastfm-art" src="${art}" alt="${name}" loading="lazy" />` : `<span class="lastfm-art lastfm-art--placeholder"></span>`}
    <span class="${iconClass}">${icon}</span>
    <a href="${trackUrl}" target="_blank" rel="noopener" class="lastfm-track">
      ${name} <span class="lastfm-artist">— ${artist}</span>
    </a>
  </li>`;
        });

        html += `</ul>`;
        container.innerHTML = html;
    }

    // Render top albums
    function renderTopAlbums(data) {
        const albums = data.topalbums.album.slice(0, 5);
        let html = `<p class="lastfm-header">Top Albums (Overall)</p><ul class="lastfm-list">`;

        albums.forEach((album) => {
            const name = album.name;
            const artist = album.artist.name;
            const albumUrl = album.url;
            const playcount = album.playcount;
            const art =
                album.image?.find((img) => img.size === "small")?.["#text"] ||
                "";

            html += `
  <li class="lastfm-item">
    ${art ? `<img class="lastfm-art" src="${art}" alt="${name}" loading="lazy" />` : `<span class="lastfm-art lastfm-art--placeholder"></span>`}
    <a href="${albumUrl}" target="_blank" rel="noopener" class="lastfm-track">
      ${name} <span class="lastfm-artist">— ${artist}</span><span class="lastfm-playcount"> (${playcount})</span>
    </a>
  </li>`;
        });

        html += `</ul>`;
        container.innerHTML = html;
    }

    // Render top artists
    function renderTopArtists(data) {
        const artists = data.topartists.artist.slice(0, 5);
        let html = `<p class="lastfm-header">Top Artists (Overall)</p><ul class="lastfm-list">`;

        artists.forEach((artist) => {
            const name = artist.name;
            const artistUrl = artist.url;
            const playcount = artist.playcount;
            const art =
                artist.image?.find((img) => img.size === "small")?.["#text"] ||
                "";

            html += `
  <li class="lastfm-item">
    ${art ? `<img class="lastfm-art" src="${art}" alt="${name}" loading="lazy" />` : `<span class="lastfm-art lastfm-art--placeholder"></span>`}
    <a href="${artistUrl}" target="_blank" rel="noopener" class="lastfm-track">
      ${name}<span class="lastfm-playcount"> (${playcount})</span>
    </a>
  </li>`;
        });

        html += `</ul>`;
        container.innerHTML = html;
    }

    // Handle view switching
    dots.forEach((dot) => {
        dot.addEventListener("click", () => {
            currentView = dot.dataset.view;
            localStorage.setItem("lastfm-view", currentView);

            // Update active dot
            dots.forEach((d) => d.classList.remove("active"));
            dot.classList.add("active");

            // Fetch and render new data
            container.innerHTML = `<p class="lastfm-loading">Loading...</p>`;
            fetchData();
        });
    });

    // Set initial active dot
    document
        .querySelector(`[data-view="${currentView}"]`)
        .classList.add("active");

    // Initial fetch
    fetchData();

    // Auto-refresh
    function startInterval() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => {
            if (document.visibilityState === "visible") fetchData();
        }, 30000);
    }
    startInterval();
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") fetchData();
    });
</script>
