<div id="lastfm-tracks" class="lastfm-widget">
  <p class="lastfm-loading">Loading recent tracks...</p>
</div>

<script>
  const apiKey = "0e7245c9a19b6563e2a301c91f053c54";
  const user = "alifnaufal";
  const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${user}&api_key=${apiKey}&format=json&limit=5`;

  function fetchTracks() {
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const tracks = data.recenttracks.track.slice(0, 5);
        const container = document.getElementById("lastfm-tracks");

        let html = `<p class="lastfm-header">Recently played</p><ul class="lastfm-list">`;

        tracks.forEach(track => {
          const isNowPlaying = track["@attr"]?.nowplaying === "true";
          const name = track.name;
          const artist = track.artist["#text"];
          const trackUrl = track.url;
          const iconClass = isNowPlaying ? "lastfm-icon playing" : "lastfm-icon paused";
          const icon = isNowPlaying ? "▶" : "♪";

          html += `
  <li class="lastfm-item">
    <span class="${iconClass}">${icon}</span>
    <a href="${trackUrl}" target="_blank" rel="noopener" class="lastfm-track">
      ${name} <span class="lastfm-artist">— ${artist}</span>
    </a>
  </li>`;
        });

        html += `</ul>`;
        container.innerHTML = html;
      })
      .catch(err => {
        console.warn("Last.fm error:", err);
        container.innerHTML = `<p class="lastfm-error">Couldn't load tracks.</p>`;
      });
  }

  fetchTracks();

  let interval;
  function startInterval() {
    if (interval) clearInterval(interval);
    interval = setInterval(() => {
      if (document.visibilityState === "visible") fetchTracks();
    }, 30000);
  }
  startInterval();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") fetchTracks();
  });
</script>
