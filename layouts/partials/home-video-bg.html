{{- if .IsHome }}
<div class="home-video-bg">
    <video
        class="home-video-bg__video"
        id="homeVideoPlayer"
        loop
        playsinline
        muted
        preload="none"
    >
        <source src="/videos/bg-video.webm" type="video/webm" />
    </video>
    <div class="home-video-bg__overlay"></div>
</div>

<script>
    (function () {
        const video = document.getElementById("homeVideoPlayer");
        if (!video) return;

        let wasPlayingBeforeFocus = false;

        video.muted = true;
        video.pause();

        window.playVideoWithSound = function () {
            video.muted = false;
            video.play().catch(function (err) {
                console.warn("Unmuted autoplay failed, retrying muted:", err);
                video.muted = true;
                video.play().catch(function (muteErr) {
                    console.warn("Even muted play failed:", muteErr);
                });
            });
        };

        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                wasPlayingBeforeFocus = !video.paused;
                if (wasPlayingBeforeFocus) video.pause();
            } else if (wasPlayingBeforeFocus) {
                video.play().catch(function (err) {
                    console.warn("Resume play after focus failed:", err);
                });
            }
        });
    })();
</script>
{{- end }}
