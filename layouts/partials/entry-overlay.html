{{- if .IsHome }}
<div class="entry-overlay" id="entryOverlay">
    <div class="entry-overlay__content">
        <span class="entry-overlay__text">Click Anywhere</span>
    </div>
</div>
<script>
    (function () {
        const overlay = document.getElementById("entryOverlay");
        if (!overlay) return;

        const textEl = overlay.querySelector(".entry-overlay__text");
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*?";
        const finalText = (textEl.textContent || "").trim();
        const TOTAL_FRAMES = 20;
        let frame = 0;
        let rafId = null;

        // Build per-character spans
        textEl.textContent = "";
        const spans = [];
        for (let i = 0; i < finalText.length; i++) {
            const c = finalText[i];
            const span = document.createElement("span");
            span.className = "entry-overlay__letter";
            if (c === " ") {
                span.textContent = "\u00A0";
                span.setAttribute("data-final", "\u00A0");
            } else {
                span.textContent = chars[Math.floor(Math.random() * chars.length)];
                span.setAttribute("data-final", c);
            }
            textEl.appendChild(span);
            spans.push(span);
        }

        function resolve() {
            for (let i = 0; i < spans.length; i++) {
                spans[i].textContent = spans[i].getAttribute("data-final");
                spans[i].classList.add("entry-overlay__letter--resolved");
            }
        }

        function scramble() {
            if (frame >= TOTAL_FRAMES) {
                rafId = null;
                resolve();
                return;
            }
            for (let i = 0; i < spans.length; i++) {
                if (finalText[i] !== " ") {
                    spans[i].textContent = chars[Math.floor(Math.random() * chars.length)];
                }
            }
            frame++;
            rafId = requestAnimationFrame(scramble);
        }

        function dismiss(e) {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            resolve();

            const ripple = document.createElement("div");
            ripple.className = "entry-overlay__ripple";
            ripple.style.setProperty("--x", e.clientX + "px");
            ripple.style.setProperty("--y", e.clientY + "px");
            overlay.appendChild(ripple);

            const coords = document.createElement("div");
            coords.className = "entry-overlay__coords";
            coords.textContent = "[" + e.clientX + ", " + e.clientY + "]";
            coords.style.setProperty("--x", e.clientX + "px");
            coords.style.setProperty("--y", e.clientY + "px");
            overlay.appendChild(coords);

            requestAnimationFrame(function () {
                overlay.classList.add("entry-overlay--dismissed");
                setTimeout(function () {
                    overlay.style.display = "none";
                    if (window.playVideoWithSound) window.playVideoWithSound();
                }, 600);
            });
        }

        rafId = requestAnimationFrame(scramble);
        overlay.addEventListener("click", dismiss, { once: true });
    })();
</script>
{{- end }}
