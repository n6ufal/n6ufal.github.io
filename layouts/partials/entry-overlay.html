{{- if .IsHome }}
<div class="entry-overlay" id="entryOverlay">
    <div class="entry-overlay__content">
        <span class="entry-overlay__text">Click Anywhere</span>
    </div>
</div>
<script>
    (function () {
        var overlay = document.getElementById("entryOverlay");
        if (!overlay) return;

        function initScramble() {
            var textEl = overlay.querySelector(".entry-overlay__text");
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*?";
            var finalText = (textEl.textContent || "").trim();
            if (!finalText) return;
            var intervals = [];
            textEl.textContent = "";
            for (var i = 0; i < finalText.length; i++) {
                (function (index) {
                    var c = finalText[index];
                    var span = document.createElement("span");
                    span.className = "entry-overlay__letter";
                    span.textContent = c === " " ? "\u00A0" : chars[Math.floor(Math.random() * chars.length)];
                    span.setAttribute("data-final", c === " " ? "\u00A0" : c);
                    textEl.appendChild(span);
                    var count = 0;
                    setTimeout(function () {
                        var id = setInterval(function () {
                            if (count < 3) {
                                span.textContent = c === " " ? "\u00A0" : chars[Math.floor(Math.random() * chars.length)];
                                count++;
                            } else {
                                clearInterval(id);
                                span.textContent = c === " " ? "\u00A0" : c;
                                span.classList.add("entry-overlay__letter--resolved");
                            }
                        }, 60);
                        intervals.push(id);
                    }, index * 60);
                })(i);
            }
            return intervals;
        }

        var scrambleIntervals = initScramble() || [];

        function resolveScramble() {
            for (var i = 0; i < scrambleIntervals.length; i++) clearInterval(scrambleIntervals[i]);
            scrambleIntervals = [];
            var spans = overlay.querySelectorAll(".entry-overlay__letter");
            for (var i = 0; i < spans.length; i++) {
                spans[i].textContent = spans[i].getAttribute("data-final") || spans[i].textContent;
                spans[i].classList.add("entry-overlay__letter--resolved");
            }
        }

        function handleClick(e) {
            resolveScramble();
            var ripple = document.createElement("div");
            ripple.className = "entry-overlay__ripple";
            ripple.style.setProperty("--x", e.clientX + "px");
            ripple.style.setProperty("--y", e.clientY + "px");
            overlay.appendChild(ripple);
            var coords = document.createElement("div");
            coords.className = "entry-overlay__coords";
            coords.textContent = "[" + e.clientX + ", " + e.clientY + "]";
            coords.style.setProperty("--x", e.clientX + "px");
            coords.style.setProperty("--y", e.clientY + "px");
            overlay.appendChild(coords);
            requestAnimationFrame(function () {
                overlay.classList.add("entry-overlay--dismissed");
                setTimeout(function () {
                    overlay.style.display = "none";
                    if (window.playVideoWithSound) window.playVideoWithSound();
                }, 600);
            });
        }

        overlay.addEventListener("click", handleClick, { once: true });

        window.resetEntryOverlay = function () {
            if (!overlay || overlay.dataset.resetting === "1") return;
            overlay.dataset.resetting = "1";
            overlay.style.display = "";
            overlay.classList.remove("entry-overlay--dismissed");
            var stale = overlay.querySelectorAll(".entry-overlay__ripple, .entry-overlay__coords");
            for (var i = 0; i < stale.length; i++) stale[i].remove();
            scrambleIntervals = initScramble() || [];
            overlay.addEventListener("click", handleClick, { once: true });
            overlay.removeAttribute("data-resetting");
        };
    })();
</script>
{{- end }}
