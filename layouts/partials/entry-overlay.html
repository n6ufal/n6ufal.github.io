{{- if .IsHome }}
<div class="entry-overlay" id="entryOverlay">
    <div class="entry-overlay__content">
        <span class="entry-overlay__text">Click Anywhere</span>
    </div>
</div>

<script>
    (function () {
        const overlay = document.getElementById("entryOverlay");
        if (!overlay) return;

        // Split "Click Anywhere" into individually-animated letter spans
        const textEl = overlay.querySelector(".entry-overlay__text");
        const chars = textEl.textContent.split("");
        textEl.textContent = "";
        chars.forEach(function (char, i) {
            var span = document.createElement("span");
            span.className = "entry-overlay__letter";
            span.textContent = char === " " ? "\u00A0" : char;
            span.style.animationDelay = i * 0.065 + "s";
            textEl.appendChild(span);
        });

        var dismissed = false;

        var dismissOverlay = function (e) {
            if (dismissed) return;
            dismissed = true;
            overlay.removeEventListener("click", dismissOverlay);

            // Spawn a ripple at the click position
            var ripple = document.createElement("div");
            ripple.className = "entry-overlay__ripple";
            ripple.style.left = e.clientX + "px";
            ripple.style.top = e.clientY + "px";
            overlay.appendChild(ripple);

            // Fade overlay out after a brief ripple head-start
            setTimeout(function () {
                overlay.classList.add("entry-overlay--dismissed");

                setTimeout(function () {
                    overlay.remove();
                    if (window.playVideoWithSound) {
                        window.playVideoWithSound();
                    }
                }, 600);
            }, 180);
        };

        overlay.addEventListener("click", dismissOverlay);
    })();
</script>
{{- end }}
