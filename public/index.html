        <div id="lastfm-tracks" style="margin-top: 1.5rem; text-align: center;">
          <p style="font-size: 0.85rem; color: var(--secondary);">Loading recent tracks...</p>
        </div>
        <script>
          const apiKey = "0e7245c9a19b6563e2a301c91f053c54";
          const user = "alifnaufal";
          const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${user}&api_key=${apiKey}&format=json&limit=5`;

          fetch(url)
            .then(res => res.json())
            .then(data => {
              const tracks = data.recenttracks.track.slice(0, 5);
              const container = document.getElementById("lastfm-tracks");

              let html = `<p style="font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary); margin-bottom: 0.75rem;">Recently played</p><ul style="list-style: none; padding: 0; margin: 0;">`;

              tracks.forEach(track => {
                const isNowPlaying = track["@attr"]?.nowplaying === "true";
                const name = track.name;
                const artist = track.artist["#text"];
                const trackUrl = track.url;

                html += `
                  <li style="margin-bottom: 0.4rem; font-size: 0.875rem; font-weight: 400;">
                    ${isNowPlaying ? `<span style="color: #A3BE8C; margin-right: 0.4rem;">▶</span>` : `<span style="color: var(--secondary); margin-right: 0.4rem;">♪</span>`}
                    <a href="${trackUrl}" target="_blank" rel="noopener" style="color: var(--primary); text-decoration: none; font-weight: 400;">
                      ${name} <span style="color: var(--secondary);">— ${artist}</span>
                    </a>
                  </li>`;
              });

              html += `</ul>`;
              container.innerHTML = html;
            })
            .catch(() => {
              document.getElementById("lastfm-tracks").innerHTML = `<p style="font-size: 0.85rem; color: var(--secondary);">Couldn't load tracks.</p>`;
            });
        </script>

    </div>
